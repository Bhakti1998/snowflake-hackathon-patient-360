[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "carelens360"
version = "0.1.0"
description = "Synthetic evidence-first Snowflake workflow"
requires-python = ">=3.9"
dependencies = [
  "snowflake-connector-python>=3.12,<4",
  "reportlab>=4,<5",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
carelens = "carelens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
