verified_queries:
  - name: "\"How many patients and clinical encounters are recorded in the adverse events data, and how many of each are unique?\""
    sql: "SELECT COUNT(patient_id) AS count_patient_id, COUNT(DISTINCT patient_id) AS distinct_patient_id, COUNT(encounter_id) AS count_encounter_id, COUNT(DISTINCT encounter_id) AS distinct_encounter_id FROM adverse_events"
    question: "How many patients and clinical encounters are recorded in the adverse events data, and how many of each are unique?"
    verified_at: 1791064051
    verified_by: <REDACTED>
    use_as_onboarding_question: false
  - name: '"How many total and unique encounters and documents are recorded in the patient document repository?"'
    sql: "SELECT COUNT(encounter_id) AS count_encounter_id, COUNT(DISTINCT encounter_id) AS distinct_encounter_id, COUNT(document_id) AS count_document_id, COUNT(DISTINCT document_id) AS distinct_document_id FROM document_chunks"
    question: How many total and unique encounters and documents are recorded in the patient document repository?
    verified_at: 1791064060
    verified_by: <REDACTED>
    use_as_onboarding_question: false
  - name: "\"How many unique patients, members, and encounters are recorded in the medical claims data?\""
    sql: "SELECT COUNT(patient_id) AS count_patient_id, COUNT(DISTINCT patient_id) AS distinct_patient_id, COUNT(member_id) AS count_member_id, COUNT(DISTINCT member_id) AS distinct_member_id, COUNT(encounter_id) AS count_encounter_id, COUNT(DISTINCT encounter_id) AS distinct_encounter_id FROM medical_claims"
    question: "How many unique patients, members, and encounters are recorded in the medical claims data?"
    verified_at: 1791064064
    verified_by: <REDACTED>
    use_as_onboarding_question: false
