name: PATIENT_360_SEMANTIC_VIEW
tables:
  - name: ADVERSE_EVENTS
    description: "The table contains records of adverse events experienced by patients, linked to specific clinical encounters. Each record captures details about a suspected drug, the nature of the event including its MedDRA preferred term classification, severity, and seriousness, as well as the outcome and any actions taken in response."
    base_table:
      database: PATIENT_360_RAG
      schema: RAW
      table: ADVERSE_EVENTS
    primary_key:
      columns:
        - ENCOUNTER_ID
    dimensions:
      - name: ACTION_TAKEN
        expr: '"action_taken"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Dose held; potassium recheck in 72h
          - Dose reduced to 16 units
          - No change; counseling
      - name: AE_ID
        expr: '"ae_id"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - AE001
          - AE002
          - AE003
      - name: ENCOUNTER_ID
        expr: '"encounter_id"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - E103
          - E126
          - E127
      - name: EVENT
        expr: '"event"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Hyperkalemia
          - Hypoglycemia (patient-reported glucose 58 mg/dL)
          - "Epistaxis, self-limited"
      - name: EVIDENCE
        expr: '"evidence"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Potassium 5.1 mmol/L (L0019)
          - Potassium 5.2 mmol/L (L0086)
          - Patient glucose log reported at visit
      - name: MEDDRA_PT
        expr: '"meddra_pt"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Hyperkalaemia
          - Epistaxis
          - Hypoglycaemia
      - name: OUTCOME
        expr: '"outcome"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Recovering
          - Recovered
      - name: PATIENT_ID
        expr: '"patient_id"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - P001
          - P011
          - P014
      - name: SERIOUS
        expr: '"serious"'
        data_type: BOOLEAN
        access_modifier: public_access
        sample_values:
          - "0"
      - name: SEVERITY
        expr: '"severity"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Moderate
          - Mild
      - name: SUSPECT_DRUG
        expr: '"suspect_drug"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Lisinopril
          - Sacubitril/valsartan
          - Insulin glargine
    time_dimensions:
      - name: ONSET_DATE
        expr: '"onset_date"'
        data_type: DATE
        access_modifier: public_access
        sample_values:
          - "20586"
          - "20545"
          - "20559"
  - name: CARE_GAPS
    description: "The table contains records of care gaps identified for patients, tracking outstanding or unmet clinical quality measures. Each record represents a single care gap for a patient and includes details about the specific measure, current status, due dates, and supporting evidence and policy documentation."
    base_table:
      database: PATIENT_360_RAG
      schema: RAW
      table: CARE_GAPS
    dimensions:
      - name: CARE_GAP
        expr: '"care_gap"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - HbA1c control (<8.0%)
          - Diabetic retinal eye exam
          - Kidney health evaluation (eGFR + uACR)
      - name: EVIDENCE
        expr: '"evidence"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Latest HbA1c 7.5% (L0021)
          - No retinal exam encounter in period
          - eGFR and uACR on file
      - name: GAP_ID
        expr: '"gap_id"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - G001
          - G002
          - G003
      - name: MEASURE
        expr: '"measure"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - GSD
          - EED
          - KED
      - name: PATIENT_ID
        expr: '"patient_id"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - P001
          - P002
          - P003
      - name: POLICY_DOC
        expr: '"policy_doc"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - DOC-REG-002
          - DOC-REG-001
          - DOC-REG-004
      - name: STATUS
        expr: '"status"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - CLOSED
          - OPEN
          - MISSED
    time_dimensions:
      - name: DUE_DATE
        expr: '"due_date"'
        data_type: DATE
        access_modifier: public_access
        sample_values:
          - "20818"
          - "20597"
          - "20543"
  - name: CONDITIONS
    description: "The table contains records of medical conditions associated with patients. Each record represents a single diagnosed condition and includes details about the condition's clinical classification, descriptive information, current status, and year of onset."
    base_table:
      database: PATIENT_360_RAG
      schema: RAW
      table: CONDITIONS
    dimensions:
      - name: CONDITION_KEY
        expr: '"condition_key"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - T2D
          - HTN
          - CKD3
      - name: DESCRIPTION
        expr: '"description"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Type 2 diabetes mellitus
          - Essential hypertension
          - "Chronic kidney disease, stage 3"
      - name: ICD10
        expr: '"icd10"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - E11.9
          - I10
          - N18.30
      - name: ONSET_YEAR
        expr: '"onset_year"'
        data_type: "NUMBER(4,0)"
        access_modifier: public_access
        sample_values:
          - "2020"
          - "2014"
          - "2012"
      - name: PATIENT_ID
        expr: '"patient_id"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - P001
          - P002
          - P003
      - name: STATUS
        expr: '"status"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - active
